# centerdet_mm5_near15.yaml 的【单模态对照】：只用 RGB，其余一字不改。
#
# 有这个对照才能把「多模态带来的收益」和「ResNet8xAttention 这个骨干本身
# 与 ResNet8x 的差异」分开。冻结骨干探针那次的教训就是没做对照差点下错结论。
#
# 近距离子集 near15 上的【全模态】版本，用来回答一个问题：
#     纯仿真域内，把 5 个模态全用上，比只用单目 RGB 好多少？
#
# 与 centerdet_rgb_near15.yaml 严格配对：同一批帧、同分辨率、同 MAX_DIS/MAX_SIZE、
# 同欧拉角约定、同轮数。唯一的变量是模态数量与随之而来的骨干。
#
# 五个模态固定顺序: rgb, ir, dvs, lidar(世界坐标图), radar(速度图)。
# 其中 lidar 是唯一直接提供 3D 信息的，预期收益主要来自它。
#
# 注意 NUM_FILTERS 特意写成 [64,128,256,512]，与 RGB 版一致 ——
# 仓库原来的 centerdet.yaml 用的是 [32,64,128,128]，直接拿它对比会把
# 「模态多少」和「模型容量」两个变量混在一起。
#
# 这个配置只回答「仿真域内」的问题。它【不能】直接迁移到 MAV6D：
# 目标域只有 RGB，模态对不上。要用上多模态仿真数据帮助单目真实域，
# 只能走跨模态蒸馏（多模态教师 -> 单目学生），那是另一条线。

DATA_CONFIG:
    _BASE_CONFIG_: cfgs/dataset_configs/uavdet_3d/laam6d.yaml
    MAX_OBJ_PER_SAMPLE: 7

    MODALITIES: ['rgb']

    FRAME_SUBSET: {
        'train': 'cfgs/subsets/near15/near_train.txt',
        'test': 'cfgs/subsets/near15/near_test.txt'
    }

    IM_RESIZE: [640, 384]
    MAX_DIS: 15
    MAX_SIZE: 4
    EULER_SEQ: 'xyz'

    DATA_PRE_PROCESSOR:
        - NAME: filter_box_outside
        - NAME: convert_box9d_to_centermap
          OFFSET: [0.0,0.0,0]
          ENCODER: center_point_encoder
        - NAME: image_normalization

MODEL:
    NAME: CenterDetLaam6d

    BACKBONE_2D:
      NAME: ResNet8xAttention
      FUSE_METHOD: channel_concat
      ATTENTION_HEADS: 1
      NUM_MODALITIES: 1
      NUM_FILTERS: [64,128,256,512]
      INPUT_CHANNELS: 3
      OUT_CHANNELS: 512

    DENSE_HEAD_2D:
      NAME: CenterHeadLaam6d
      INPUT_CHANNELS: 512
      SEPARATE_HEAD_CFG:
          HEAD_ORDER: [ 'hm', 'center_res', 'center_dis', 'dim', 'rot' ]
          HEAD_DICT: {
              'hm': { 'out_channels': 7, 'conv_dim': 128},
              'center_res': { 'out_channels': 2, 'conv_dim': 128},
              'center_dis': { 'out_channels': 1, 'conv_dim': 128},
              'dim': { 'out_channels': 3, 'conv_dim': 128},
              'rot': { 'out_channels': 6, 'conv_dim': 128},
          }

    POST_PROCESSING:
      DECONDER: center_point_decoder
      MAX_OBJ: 7
      SCORE_THRESH: 0.0


OPTIMIZATION:
    BATCH_SIZE_PER_GPU: 4
    NUM_EPOCHS: 30

    OPTIMIZER: adam_onecycle
    LR: 0.001
    WEIGHT_DECAY: 0.01
    MOMENTUM: 0.9

    MOMS: [0.95, 0.85]
    PCT_START: 0.4
    DIV_FACTOR: 10
    DECAY_STEP_LIST: [20, 27]
    LR_DECAY: 0.1
    LR_CLIP: 0.0000001

    LR_WARMUP: False
    WARMUP_EPOCH: 1

    GRAD_NORM_CLIP: 10
