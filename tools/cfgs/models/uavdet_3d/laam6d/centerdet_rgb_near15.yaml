# centerdet_rgb_near8.yaml 的放宽版：Z <= 15 m。
#
# near8 与 MAV6D 尺度最贴（Z 中位 4.9 m），但全库只有 1188 帧太少；
# 这一版把阈值放到 15 m，换来 11134 帧（train 8773 / test 2361），
# 深度仍比原始源域（中位 42 m、MAX_DIS=150）近一个数量级。
#
# 完整的设计说明见 centerdet_rgb_near8.yaml，这里只改三处：
#   FRAME_SUBSET -> near15、MAX_DIS -> 15、NUM_EPOCHS 相应减少。
#
# 子集生成：
#     python tools/build_near_subset.py build --root E:/data_collect \
#         --max-dist 15 --mode all --out-dir cfgs/subsets/near15
#
# 实测: 粗筛(欧氏<=22.5m) 534 条序列 / 28939 帧
#       -> 精筛(15m >= Z >= 0.5m) 310 条序列 / 11134 帧

DATA_CONFIG:
    _BASE_CONFIG_: cfgs/dataset_configs/uavdet_3d/laam6d.yaml
    MAX_OBJ_PER_SAMPLE: 7

    MODALITIES: ['rgb']

    FRAME_SUBSET: {
        'train': 'cfgs/subsets/near15/near_train.txt',
        'test': 'cfgs/subsets/near15/near_test.txt'
    }

    # 从基配置的 960x560 降到 640x384。两个理由，不只是为了快：
    #  1) 对齐表观大小。源域目标 1.3 m @15 m 在 960x560 下热图约 5.2 px，
    #     MAV6D 目标 0.34 m @8 m 在 512x256 下只有 2.8 px —— 源域目标反而更大。
    #     降到 640x384 后源域是 3.4 px，和 MAV6D 接近。
    #  2) 960x560 batch 8 时显存 23.5/24.5 GB 濒临 OOM，算力也吃满。
    # 640/8=80、384/8=48 都能整除 stride。内参会随 IM_RESIZE 自动缩放，无需手改。
    IM_RESIZE: [640, 384]

    MAX_DIS: 15

    # MAX_SIZE 必须 >= 数据里最大的 GT 尺寸，否则 dim 的归一化目标会超过 1。
    # 实测(采样 975 帧)全类别 GT 尺寸: 中位 0.68 / 95% 1.47 / 最大 2.63 m
    #   Matrice-600-Pro  max 2.63  <- 唯一超过 2 的机型
    #   matrix-300-RTK   max 1.60
    #   其余全部 <= 1.30
    # 曾经误设为 2（当时错以为 OB_SIZE 的 1.3 就是实际尺寸，但 OB_SIZE 只是
    # 透传的元数据，dim 的监督值其实来自标注角点的极差），结果 Matrice-600-Pro
    # 的目标值到了 1.07，该类 ADS 只有 27.94 而其他类都在 60-69。
    # 保持与基配置 laam6d.yaml 一致的 4。
    MAX_SIZE: 4

    # 与 MAV6D 对齐的旋转约定，理由见 centerdet_rgb_near8.yaml
    EULER_SEQ: 'xyz'

    DATA_PRE_PROCESSOR:
        - NAME: filter_box_outside
        - NAME: convert_box9d_to_centermap
          OFFSET: [0.0,0.0,0]
          ENCODER: center_point_encoder
        - NAME: image_normalization

MODEL:
    NAME: CenterDet

    BACKBONE_2D:
      NAME: ResNet8x
      NUM_FILTERS: [64,128,256,512]
      INPUT_CHANNELS: 3
      OUT_CHANNELS: 512

    DENSE_HEAD_2D:
      NAME: CenterHead
      INPUT_CHANNELS: 512
      SEPARATE_HEAD_CFG:
          HEAD_ORDER: [ 'hm', 'center_res', 'center_dis', 'dim', 'rot' ]
          HEAD_DICT: {
              'hm': { 'out_channels': 7, 'conv_dim': 128},
              'center_res': { 'out_channels': 2, 'conv_dim': 128},
              'center_dis': { 'out_channels': 1, 'conv_dim': 128},
              'dim': { 'out_channels': 3, 'conv_dim': 128},
              'rot': { 'out_channels': 6, 'conv_dim': 128},
          }

    POST_PROCESSING:
      DECONDER: center_point_decoder_laam6d
      MAX_OBJ: 7
      SCORE_THRESH: 0.0


OPTIMIZATION:
    BATCH_SIZE_PER_GPU: 4
    NUM_EPOCHS: 30

    OPTIMIZER: adam_onecycle
    LR: 0.001
    WEIGHT_DECAY: 0.01
    MOMENTUM: 0.9

    MOMS: [0.95, 0.85]
    PCT_START: 0.4
    DIV_FACTOR: 10
    DECAY_STEP_LIST: [20, 27]
    LR_DECAY: 0.1
    LR_CLIP: 0.0000001

    LR_WARMUP: False
    WARMUP_EPOCH: 1

    GRAD_NORM_CLIP: 10
