DATA_CONFIG:
    _BASE_CONFIG_: cfgs/dataset_configs/uavdet_3d/laam6d.yaml
    MAX_OBJ_PER_SAMPLE: 7
    DATA_PRE_PROCESSOR:
        - NAME: filter_box_outside
        # - NAME: convert_box9d_to_heatmap
        #   OFFSET: [0.0,0.0,0]
        #   ENCODER: key_point_encoder
        #   ENCODER_CORNER: [[-0.5, -0.5, 0],[0.5, -0.5, 0],[0.5, 0.5, 0],[-0.5, 0.5, 0]]
        - NAME: convert_box9d_to_centermap
          OFFSET: [0.0,0.0,0]
          ENCODER: center_point_encoder
        - NAME: image_normalization

MODEL:
    NAME: CenterDetLaam6d

    BACKBONE_2D:
      NAME: ResNet8xAttention
      FUSE_METHOD : channel_concat  # [channel_concat, concat, weighted_sum, attention, gatting]
      ATTENTION_HEADS : 1
      NUM_MODALITIES : 5
      NUM_FILTERS: [32,64,128,128]
      INPUT_CHANNELS: 3
      OUT_CHANNELS: 512

    DENSE_HEAD_2D:
      NAME: CenterHeadLaam6d
      INPUT_CHANNELS: 512
      SEPARATE_HEAD_CFG:
          HEAD_ORDER: [ 'hm', 'center_res', 'center_dis', 'dim', 'rot' ]
          HEAD_DICT: {
              'hm': { 'out_channels': 7, 'conv_dim': 128},
              'center_res': { 'out_channels': 2, 'conv_dim': 128},
              'center_dis': { 'out_channels': 1, 'conv_dim': 128},
              'dim': { 'out_channels': 3, 'conv_dim': 128},
              'rot': { 'out_channels': 6, 'conv_dim': 128},
          }

    POST_PROCESSING:
      DECONDER: center_point_decoder
      MAX_OBJ: 7
      SCORE_THRESH: 0.0


OPTIMIZATION:
    BATCH_SIZE_PER_GPU: 2
    NUM_EPOCHS: 100

    OPTIMIZER: adam_onecycle
    LR: 0.001
    WEIGHT_DECAY: 0.01
    MOMENTUM: 0.9

    MOMS: [0.95, 0.85]
    PCT_START: 0.4
    DIV_FACTOR: 10
    DECAY_STEP_LIST: [5, 10]
    LR_DECAY: 0.1
    LR_CLIP: 0.0000001

    LR_WARMUP: False
    WARMUP_EPOCH: 1

    GRAD_NORM_CLIP: 10
