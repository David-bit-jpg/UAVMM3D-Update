# 源域 (UAV-MM3D / LAAM6D) 的 RGB-only 版本，专为迁移到 MAV6D 准备。
#
# 与 laam6d/centerdet.yaml 的区别，全部是为了和 mav6d/centerdet.yaml 对齐：
#
#   模态   : MODALITIES: ['rgb']  -> image 变成 (1,3,H,W)，K=1，与 MAV6D 一致
#            （原配置是 rgb+ir+dvs+lidar+radar 五模态，K=5）
#   骨干   : ResNet8xAttention(5 模态融合, 通道[32,64,128,128], 输出 4D)
#            -> ResNet8x(单模态, 通道[64,128,256,512], 输出 5D)，与 MAV6D 逐字相同
#   检测头 : CenterHeadLaam6d(吃 4D) -> CenterHead(吃 5D)，与 MAV6D 相同
#            两者内部都是 self.__setattr__(name, Sequential(...))，参数名一致
#   检测器 : CenterDetLaam6d -> CenterDet
#
# 这样训出来的 ckpt，除 hm 层(7 类 vs 2 类)外所有权重都能直接载入 MAV6D 模型。
# 用 tools/align_audit.py 可以核对到底有多少张量真正对上了。

DATA_CONFIG:
    _BASE_CONFIG_: cfgs/dataset_configs/uavdet_3d/laam6d.yaml
    MAX_OBJ_PER_SAMPLE: 7

    # 只保留 RGB。可选值: rgb / ir / dvs / lidar / radar，rgb 必选
    # （标注与内外参都取自 RGB 相机）
    MODALITIES: ['rgb']

    # 想把输入分辨率也和 MAV6D (512x256) 对齐可以改这里，但源域目标更小更远，
    # 降分辨率会明显掉点；默认保持源域原值，把分辨率差异留给 fine-tune 阶段吸收。
    # IM_RESIZE: [512, 256]

    DATA_PRE_PROCESSOR:
        - NAME: filter_box_outside
        - NAME: convert_box9d_to_centermap
          OFFSET: [0.0,0.0,0]
          ENCODER: center_point_encoder     # 经 pre_processor_laam6d 解析到 object_encoder_laam6d
        - NAME: image_normalization

MODEL:
    NAME: CenterDet

    BACKBONE_2D:
      NAME: ResNet8x
      NUM_FILTERS: [64,128,256,512]
      INPUT_CHANNELS: 3
      OUT_CHANNELS: 512

    DENSE_HEAD_2D:
      NAME: CenterHead
      INPUT_CHANNELS: 512
      SEPARATE_HEAD_CFG:
          HEAD_ORDER: [ 'hm', 'center_res', 'center_dis', 'dim', 'rot' ]
          HEAD_DICT: {
              'hm': { 'out_channels': 7, 'conv_dim': 128},    # 源域 7 类；MAV6D 是 2，仅此层不可迁
              'center_res': { 'out_channels': 2, 'conv_dim': 128},
              'center_dis': { 'out_channels': 1, 'conv_dim': 128},
              'dim': { 'out_channels': 3, 'conv_dim': 128},
              'rot': { 'out_channels': 6, 'conv_dim': 128},
          }

    POST_PROCESSING:
      # 必须用 laam6d 那一对：源域编码器用的是「已缩放的内参 + 1/stride」，
      # 解码完还要把相机系转回世界系（源域 GT 存的是世界坐标）。
      # object_encoder.py 里同名的那个带 CARLA 轴置换，和这条链路不互逆。
      DECONDER: center_point_decoder_laam6d
      MAX_OBJ: 7
      SCORE_THRESH: 0.0


OPTIMIZATION:
    BATCH_SIZE_PER_GPU: 4
    NUM_EPOCHS: 30

    OPTIMIZER: adam_onecycle
    LR: 0.001
    WEIGHT_DECAY: 0.01
    MOMENTUM: 0.9

    MOMS: [0.95, 0.85]
    PCT_START: 0.4
    DIV_FACTOR: 10
    DECAY_STEP_LIST: [20, 27]
    LR_DECAY: 0.1
    LR_CLIP: 0.0000001

    LR_WARMUP: False
    WARMUP_EPOCH: 1

    GRAD_NORM_CLIP: 10
