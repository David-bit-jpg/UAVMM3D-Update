# 同 teacher.yaml，只把数据集换成尺度对齐缓存 mmcache_crop（E:/mmcache/mm20c，目标表观大小 ≈ MAV6D）。
# 多模态教师：rgb(3) + ir(1) + LiDAR depth(1) + LiDAR drone-tag(1) = 6 通道，输入端拼接。
# IR 对光照/天气不敏感，LiDAR 直接给几何 —— 正好对应 RGB 单模态迁移失败的两个轴
#（天气、尺寸/距离）。教师本身不部署，只用来蒸馏 RGB 学生。
DATA_CONFIG:
    _BASE_CONFIG_: cfgs/dataset_configs/uavdet_3d/mmcache_crop.yaml
    MAX_OBJ_PER_SAMPLE: 7
    MODALITIES: ['rgb', 'ir', 'depth', 'tag']

MODEL:
    NAME: CenterDet

    BACKBONE_2D:
      NAME: ResNet8x
      NUM_FILTERS: [64,128,256,512]
      INPUT_CHANNELS: 6
      OUT_CHANNELS: 512

    DENSE_HEAD_2D:
      NAME: CenterHead
      INPUT_CHANNELS: 512
      SEPARATE_HEAD_CFG:
          HEAD_ORDER: [ 'hm', 'center_res', 'center_dis', 'dim', 'rot' ]
          HEAD_DICT: {
              'hm': { 'out_channels': 7, 'conv_dim': 128},
              'center_res': { 'out_channels': 2, 'conv_dim': 128},
              'center_dis': { 'out_channels': 1, 'conv_dim': 128},
              'dim': { 'out_channels': 3, 'conv_dim': 128},
              'rot': { 'out_channels': 6, 'conv_dim': 128},
          }

    POST_PROCESSING:
      DECONDER: center_point_decoder_mav6d
      MAX_OBJ: 7
      SCORE_THRESH: 0.1


OPTIMIZATION:
    BATCH_SIZE_PER_GPU: 16
    NUM_EPOCHS: 16

    OPTIMIZER: adam_onecycle
    LR: 0.001
    WEIGHT_DECAY: 0.01
    MOMENTUM: 0.9

    MOMS: [0.95, 0.85]
    PCT_START: 0.4
    DIV_FACTOR: 10
    DECAY_STEP_LIST: [10, 14]
    LR_DECAY: 0.1
    LR_CLIP: 0.0000001

    LR_WARMUP: False
    WARMUP_EPOCH: 1

    GRAD_NORM_CLIP: 10
