# 蒸馏学生（S1）：学生只看 RGB，教师 = teacher_mix（rgb+ir+depth+tag），数据集 mmcache_mix。
# 蒸馏项与 student_kd.yaml 相同（特征 L2 / GT 中心像素余弦 / 热图软标签 / 前景回归 / CrossKD）。
# 存下来的 ckpt 是干净的 RGB CenterDet，直接 --pretrained_model 迁 MAV6D。
DATA_CONFIG:
    _BASE_CONFIG_: cfgs/dataset_configs/uavdet_3d/mmcache_mix.yaml
    MAX_OBJ_PER_SAMPLE: 7
    MODALITIES: ['rgb', 'ir', 'depth', 'tag']    # 数据集吐全部通道，教师用；学生在模型里切前 3 个

MODEL:
    NAME: CenterDetKD
    DISTILL:
        TEACHER_CFG: cfgs/models/uavdet_3d/mmcache/teacher_mix.yaml
        TEACHER_CKPT: 'SET_AT_LAUNCH.pth'     # 用 --set MODEL.DISTILL.TEACHER_CKPT <path> 传入
        STUDENT_CHANNELS: 3
        TEACHER_CHANNELS: 6
        # 2026-09-07 第一次跑（v1，逐元素 L2）：kd_feat 训到最后仍 ~390，总损失被它独占，GRAD_NORM_CLIP 10 之下
        # 检测项几乎拿不到梯度，域内召回从 M0 的 0.51 掉到 0.22（S1MT 0.24）。改成逐像素余弦（尺度不变，[0,2]）。
        FEAT_MODE: 'cos'
        W_FEAT: 1.0
        W_CENTER_COS: 1.0
        W_HM: 1.0
        W_REG: 1.0
        W_CROSS: 0.5

    BACKBONE_2D:
      NAME: ResNet8x
      NUM_FILTERS: [64,128,256,512]
      INPUT_CHANNELS: 3
      OUT_CHANNELS: 512

    DENSE_HEAD_2D:
      NAME: CenterHead
      INPUT_CHANNELS: 512
      SEPARATE_HEAD_CFG:
          HEAD_ORDER: [ 'hm', 'center_res', 'center_dis', 'dim', 'rot' ]
          HEAD_DICT: {
              'hm': { 'out_channels': 7, 'conv_dim': 128},
              'center_res': { 'out_channels': 2, 'conv_dim': 128},
              'center_dis': { 'out_channels': 1, 'conv_dim': 128},
              'dim': { 'out_channels': 3, 'conv_dim': 128},
              'rot': { 'out_channels': 6, 'conv_dim': 128},
          }

    POST_PROCESSING:
      DECONDER: center_point_decoder_mav6d
      MAX_OBJ: 7
      SCORE_THRESH: 0.1


OPTIMIZATION:
    BATCH_SIZE_PER_GPU: 16
    NUM_EPOCHS: 16

    OPTIMIZER: adam_onecycle
    LR: 0.001
    WEIGHT_DECAY: 0.01
    MOMENTUM: 0.9

    MOMS: [0.95, 0.85]
    PCT_START: 0.4
    DIV_FACTOR: 10
    DECAY_STEP_LIST: [10, 14]
    LR_DECAY: 0.1
    LR_CLIP: 0.0000001

    LR_WARMUP: False
    WARMUP_EPOCH: 1

    GRAD_NORM_CLIP: 10
