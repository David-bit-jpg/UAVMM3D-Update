# 评测 K 臂：结构与训练一致。
_BASE_CONFIG_: cfgs/models/uavdet_3d/camnorm/mav6d_r34_ratio_pp.yaml
DATA_CONFIG:
    _BASE_CONFIG_: cfgs/dataset_configs/uavdet_3d/camnorm_mav6d_kp.yaml
MODEL:
    DENSE_HEAD_2D:
      HEAD_BIAS: true
      LOSS_WEIGHTS: {hm: 1.0, center_res: 2.0, center_dis: 8.0, dim: 2.0, rot: 4.0, kp2d: 4.0}
      SEPARATE_HEAD_CFG:
          HEAD_ORDER: ["hm", "center_res", "center_dis", "dim", "rot", "kp2d"]
          HEAD_DICT: {
              "hm": {"out_channels": 1, "conv_dim": 128},
              "center_res": {"out_channels": 2, "conv_dim": 128},
              "center_dis": {"out_channels": 1, "conv_dim": 128},
              "dim": {"out_channels": 3, "conv_dim": 128},
              "rot": {"out_channels": 6, "conv_dim": 128},
              "kp2d": {"out_channels": 16, "conv_dim": 128},
          }
    POST_PROCESSING:
      MAX_OBJ: 1
      POSE_FROM_KP2D: true
