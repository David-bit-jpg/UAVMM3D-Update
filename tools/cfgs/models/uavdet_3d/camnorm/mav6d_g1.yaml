# 评测 G1：骨干与头的结构必须和训练一致，否则 eval_camnorm 会拒绝（权重载不全）。
_BASE_CONFIG_: cfgs/models/uavdet_3d/camnorm/mav6d.yaml
DATA_CONFIG:
    _BASE_CONFIG_: cfgs/dataset_configs/uavdet_3d/camnorm_mav6d_g1.yaml
MODEL:
    BACKBONE_2D:
      NAME: TvResNet
      ARCH: resnet34
      PRETRAINED: true
      BGR_INPUT: true
      INPUT_CHANNELS: 3
      OUT_CHANNELS: 512
      FPN_CHANNELS: 128
      FREEZE_BN: false
    DENSE_HEAD_2D:
      HEAD_BIAS: true
      LOSS_WEIGHTS: {hm: 1.0, center_res: 2.0, center_dis: 8.0, dim: 2.0, rot: 4.0, size2d: 4.0}
      SEPARATE_HEAD_CFG:
          HEAD_ORDER: ["hm", "center_res", "center_dis", "dim", "rot", "size2d"]
          HEAD_DICT: {
              "hm": {"out_channels": 1, "conv_dim": 128},
              "center_res": {"out_channels": 2, "conv_dim": 128},
              "center_dis": {"out_channels": 1, "conv_dim": 128},
              "dim": {"out_channels": 3, "conv_dim": 128},
              "rot": {"out_channels": 6, "conv_dim": 128},
              "size2d": {"out_channels": 2, "conv_dim": 128},
          }
    POST_PROCESSING:
      DEPTH_FROM_SIZE2D: true
