# 自训练第二版 ST2（2026-09-24 22:00）：同 st_mav6d_r34_geo_full_tr，伪标签换成 index_pseudo_st2（旋转 = 位置网络自己的 rot 头，不是 KZ）。
# 为什么：ST1 用 KZ 航向做伪框，size2d 目标（伪框投影 2D 宽）编码的是 KZ 的偏航，而部署解深度时用的是 rot 头的偏航
# （Z = f·L_perp(lwh, R_rot头) / w2d），两者不一致 → 位置 0.287 → 0.580 m 崩掉。伪框旋转必须与解码器用的旋转同源。
_BASE_CONFIG_: cfgs/models/uavdet_3d/camnorm/st_mav6d_r34_geo_full_tr.yaml
DATA_CONFIG:
    INDEX_FILE: 'index_pseudo_st2.pkl'
