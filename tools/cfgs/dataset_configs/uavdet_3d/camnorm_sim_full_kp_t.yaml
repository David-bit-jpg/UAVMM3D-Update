# K 臂数据：产出 kp2d 监督图（8 个角点相对中心的图像偏移，16 通道），位姿交给 PnP。
# 为什么：能跨域迁移的是【定位类】的 2D 量（热力图中心 9.7 px、检出 85%），不迁移的是【尺度类】的量
# （size2d 域内 0.99、真实域宽 0.85 高 0.53）。角点位置是定位问题，深度和朝向都由几何解出。
# 目标级随机化保持中等强度：它保护深度，但会削弱朝向需要的细节（实测 B 79.1° vs D 89.7°）。
_BASE_CONFIG_: cfgs/dataset_configs/uavdet_3d/camnorm_sim_full_t.yaml
TARGET_NORM: 'standard'
MAKE_KP2D: true
AUG: {hflip: 0.5, scale: [1.0, 1.0], photometric: true, noise: 0.01, blur: 0.0, blur_prob: 0.5,
      target_ring: 0.3, target_ring_core: [0.6, 1.0], target_ring_alpha: [0.3, 0.8],
      target_blur: 0.2, target_blur_len: 5}
