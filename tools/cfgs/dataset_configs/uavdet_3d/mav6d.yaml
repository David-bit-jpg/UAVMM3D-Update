DATA_PATH: 'D:\dataset\MAV6D'

DATASET: 'MAV6D_Det_Dataset'
# 标签 / split 子目录名（自训练用 labels_pseudo_<tag> / split_pseudo_<tag>，见 tools/mav6d_pseudo_label.py）。
# 缺省就是原目录；放在这里是因为 --set 只能覆盖已有的键。
LABEL_DIR: 'labels'
SPLIT_DIR: 'split'

CLASS_NAMES: ['mavic2', 'phantom4']

DATA_SPLIT: {
    'train': train,
    'test': test
}

SAMPLED_INTERVAL: {
    'train': 1,
    'test': 1
}

# 官方 util.py 里 phantom4 在 MAV 坐标系下的角点范围：
#   x [-0.18, 0.16] -> 0.34    y [-0.16, 0.18] -> 0.34    z [-0.17, 0.06] -> 0.23
# 原来写的 0.240 x 0.240 x 0.230 把长宽少算了约三成。
# 注意几何中心相对 VICON 原点还偏了 (-0.01, +0.01, -0.055) m（主要在 z）。
# mavic2 的尺寸官方脚本里没给，暂与 phantom4 共用一组。
OB_SIZE: [[.34, .34, .23]]

IM_SIZE: [1920, 1080]
IM_RESIZE: [512, 256]

IM_NUM: 1


CENTER_RAD: 2

STRIDE: 8

MAX_DIS: 8
# convert_box9d_to_centermap 会用 dim / MAX_SIZE 做归一化，之前这里缺这一项，
# 走中心点路径会 AttributeError。MAV6D 目标本体约 0.24 m，取 1 留足余量。
MAX_SIZE: 1

# 旋转的回归表示：
#   'euler6' —— (cos,sin) x 三个欧拉角，历史行为
#   'r6d'    —— 旋转矩阵前两列的 6D 连续表示（Zhou et al. CVPR19），Gram-Schmidt 解码
# 两者都占 rot 头的 6 个通道，网络结构不用改。
# 换 r6d 的理由：as_euler 在中间角接近 ±90° 时万向锁，(a1,a3) 不唯一。
# MAV6D 训练集实测 |a2|>80° 占 9.5%、>85° 占 3.4%，这部分监督是自相矛盾的。
# 实测（uavdet3d/utils/rotation_repr.py 自检）：姿态扰动 0.5° 时，
# 近万向锁处 euler6 的目标最大跳变 0.2037，r6d 只有 0.0122，差 17 倍。
ROT_REPR: 'euler6'

# 按本域统计量归一化 rgb（BGR，x/255 后；train 抽样 200 帧实测）。与源域 mmcache.yaml 的一组对应，
# 两域输入都对齐到零均值单位方差 —— 输入层面的最简单域对齐。
# 注意：早于 2026-09-06 训出的 MAV6D 权重没有这一步，重新评测它们时要把这两项去掉。
NORM_MEAN: [0.4569, 0.4634, 0.4588]
NORM_STD: [0.2075, 0.2075, 0.2029]



DATA_PRE_PROCESSOR:
    - NAME: convert_box9d_to_heatmap
      OFFSET: [0.0,0.0,0]
      ENCODER: key_point_encoder
      ENCODER_CORNER: [[-0.5, -0.5, 0],[0.5, -0.5, 0],[0.5, 0.5, 0],[-0.5, 0.5, 0]]
    - NAME: image_normalization

DATA_AUGMENTOR:
  AUG_CONFIG_LIST:
        - NAME: image_flip
          DATA_LIST: ['image', 'heatmap']
          ALONG_AXIS_LIST: ['x']

        - NAME: image_rot
          DATA_LIST: ['image', 'heatmap']
          ROT_RANGE: [-0.78539816, 0.78539816]