# 多模态缓存数据集（tools/build_mm_cache.py 产出）。
# 源域 = UAV-MM3D 的 mm20 子集：任一目标 <= 20 m 且整框可见，保留全部天气/批次/多目标。
# 用户要求数据一律放 E 盘（机械盘）。memmap 是大块顺序/随机读，实测比直读 PNG 快一个量级。
DATA_PATH: 'E:/mmcache/mm20'
DATASET: 'MMCache_Det_Dataset'

CLASS_NAMES: ['DJI-avata2','DJI-phantom4','drone-unk3','m210-rtk','DJI-mavic-mini','Matrice-600-Pro','matrix-300-RTK']

DATA_SPLIT: {
    'train': train,
    'test': test
}
SAMPLED_INTERVAL: {
    'train': 1,
    'test': 1
}

# 通道顺序固定 rgb, ir, depth, tag；蒸馏时学生只切前 3 个通道，所以 rgb 必须排第一
MODALITIES: ['rgb']

# 只用 RGB 里看得见目标的帧（最近合格目标处的局部对比度 >= 该灰度级；0 = 不过滤）。
# 实测 mm20 夜间帧目标对比度中位 2.3-2.9、白天 8.5-15.4；目标域 MAV6D 是明亮室内。
# 教师、学生、蒸馏都用同一批帧，保证可比。分数文件 vis_score.npy 由 tools/mm_vis_score.py 生成。
MIN_RGB_VIS: 5.0

# 在线增广（只在训练时；仓库原有 DATA_AUGMENTOR 从未被调用，这里才是真的）。
# 几何项同步改 K 与相机系 3D 框：hflip 概率；scale 为随机尺度区间（直接练表观尺度鲁棒性，
# 源域与 MAV6D 表观大小差 2.84 倍）；photometric 为亮度/对比度/gamma/逐通道增益；noise 为高斯噪声 std。
AUG: {hflip: 0.5, scale: [0.8, 1.25], photometric: true, noise: 0.01}

# 按本域统计量归一化 rgb（BGR 顺序，x/255 后）。mm20 可见帧实测 600 帧。
# 目标域 MAV6D 用它自己的一组（见 mav6d.yaml），两域输入分布对齐到零均值单位方差。
NORM_MEAN: [0.3982, 0.3668, 0.3631]
NORM_STD: [0.2791, 0.2445, 0.2473]
DEPTH_MAX: 40          # depth 通道 = 米 / DEPTH_MAX，截断到 1

OB_SIZE: [[1.0, 1.0, 1.0]]     # 只是透传的元数据，dim 真值来自标注（见 results 文档）
IM_SIZE: [1280, 720]           # 原始分辨率，内参按它给
IM_RESIZE: [512, 288]          # 必须等于缓存分辨率
IM_NUM: 1
CENTER_RAD: 2
STRIDE: 8

# 标签里最远的框 40 m（build_mm_cache --max-label-range），归一化深度不会超 1
MAX_DIS: 40
# 最大机型 Matrice-600-Pro 边长 2.63 m，4 留足余量（曾误设 2 导致该类失准）
MAX_SIZE: 4

ROT_REPR: 'euler6'
EULER_SEQ: 'xyz'

DATA_PRE_PROCESSOR:
    - NAME: convert_box9d_to_centermap
      OFFSET: [0.0,0.0,0]
      ENCODER: center_point_encoder_mav6d    # 相机系 + 内参，与解码严格互逆；畸变为 0

# 仓库里增广从未被调用（见 benchmark 文档 §7.3），这里只是为了满足 DatasetTemplate 的字段要求
DATA_AUGMENTOR:
  AUG_CONFIG_LIST:
        - NAME: image_flip
          DATA_LIST: ['image', 'heatmap']
          ALONG_AXIS_LIST: ['x']
