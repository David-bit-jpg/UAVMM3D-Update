# M 臂数据：D 臂的增广调温和（关掉全局带宽模糊、目标外圈随机化降到 0.3），其余不变。
# 为什么：强随机化保护深度但削弱朝向所需的细节 —— 域内角度 B（无目标随机化）79.1° vs D（有）89.7°，
# 而 D24 训 24 轮后域内 34.6°，旧基线（无模糊增广）是 14~18°。M 用来分清「增广强度」值多少。
_BASE_CONFIG_: cfgs/dataset_configs/uavdet_3d/camnorm_sim_full_geo_t.yaml
AUG: {hflip: 0.5, scale: [1.0, 1.0], photometric: true, noise: 0.01, blur: 0.0, blur_prob: 0.5,
      target_ring: 0.3, target_ring_core: [0.6, 1.0], target_ring_alpha: [0.3, 0.8],
      target_blur: 0.2, target_blur_len: 5}
