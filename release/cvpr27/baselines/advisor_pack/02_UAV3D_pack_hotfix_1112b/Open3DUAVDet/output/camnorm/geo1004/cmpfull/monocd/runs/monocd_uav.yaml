# [UAV port] runs/monocd.yaml (official KITTI config) with the minimal UAV changes. Lines that differ from the
# official file are marked "# UAV:". Everything else (backbone, heads, losses, weights, optimizer, lr, batch,
# augmentation, uncertainty weighting, edge fusion, ...) is copied verbatim.
DATASETS:
  DETECT_CLASSES: ("drone", )        # UAV: single class
  TRAIN: ("uav_train",)              # UAV
  TEST: ("uav_val",)                 # UAV
  TRAIN_SPLIT: "train"
  TEST_SPLIT: "val"
  MAX_OBJECTS: 40

  USE_RIGHT_IMAGE: False
  CONSIDER_OUTSIDE_OBJS: True
  FILTER_ANNO_ENABLE: True
  FILTER_MORE_STRICTLY: True         # only the truncation<=0.5 part is used (see data/datasets/uav.py)
  FILTER_MORE_SMOOTHLY: False

INPUT:
  HEIGHT_TRAIN: 544                  # UAV: SPEC 960x540 + bottom zero pad to 960x544 (KITTI: 1280x384)
  WIDTH_TRAIN: 960
  HEIGHT_TEST: 544
  WIDTH_TEST: 960
  HEATMAP_CENTER: '3D'
  AUG_PARAMS: [[0.5]]

  ORIENTATION: 'multi-bin'
  MODIFY_ALPHA: False
  ORIENTATION_BIN_SIZE: 4

  APPROX_3D_CENTER: 'intersect'
  ADJUST_BOUNDARY_HEATMAP: True
  KEYPOINT_VISIBLE_MODIFY: True

MODEL:
  INPLACE_ABN: True
  HEAD:
    REGRESSION_HEADS: [ [ '2d_dim' ],
                        [ '3d_offset' ],
                        [ 'corner_offset' ],
                        [ 'corner_uncertainty' ],
                        [ '3d_dim' ],
                        [ 'ori_cls', 'ori_offset' ],
                        [ 'depth' ],
                        [ 'depth_uncertainty' ],
                        [ 'compensated_depth_uncertainty' ],
                        [ 'y3d_offset' ],                    # UAV: Y of the object from the official y3d head
                        [ 'y3d_uncertainty' ],               #      (replaces the ground-plane/horizon Y)
    ]
    REGRESSION_CHANNELS: [ [ 4, ],
                           [ 2, ],
                           [ 20 ],
                           [ 3 ],
                           [ 3, ],
                           [ 24, 24 ],                         # UAV: 3 angles (yaw, pitch, roll) x (4 bins x 2) (KITTI: [8, 8])
                           [ 1, ],
                           [ 1, ],
                           [ 3, ],
                           [ 1, ],
                           [ 1, ],
    ]

    ENABLE_EDGE_FUSION: True
    TRUNCATION_OUTPUT_FUSION: 'add'
    EDGE_FUSION_NORM: 'BN'
    TRUNCATION_OFFSET_LOSS: 'log'

    BN_MOMENTUM: 0.1

    USE_NORMALIZATION: "BN"
    LOSS_TYPE: ["Penalty_Reduced_FocalLoss", "L1", "giou", "L1"]

    MODIFY_INVALID_KEYPOINT_DEPTH: True

    CORNER_LOSS_DEPTH: 'raw_and_compensated_depth'
    LOSS_NAMES: ['hm_loss',
                 'bbox_loss',
                 'depth_loss',
                 'offset_loss',
                 'orien_loss',
                 'dims_loss',
                 'corner_loss',
                 'keypoint_loss',
                 'keypoint_depth_loss',
                 'trunc_offset_loss',
                 'weighted_avg_depth_loss',
                 'compensated_depth_loss',
                 'y3d_offset_loss',                  # UAV: replaces 'horizon_hm_loss'
    ]
    LOSS_UNCERTAINTY: [True, True, False, True, True, True, True, True, False, True, True]
    INIT_LOSS_WEIGHT: [1,
                       1,
                       1,
                       0.5,
                       1,
                       1,
                       0.2,
                       1.0,
                       0.2,
                       0.1,
                       0.2,
                       0.1,
                       1,                            # UAV: y3d_offset_loss (same weight as depth_loss / horizon_hm_loss)
    ]

    CENTER_MODE: 'max'
    HEATMAP_TYPE: 'centernet'
    DIMENSION_REG: ['exp', True, False]
    USE_UNCERTAINTY: False

    DEPTH_MODE: 'inv_sigmoid'
    OUTPUT_DEPTH: 'soft'
    DIMENSION_WEIGHT: [1, 1, 1]

    UNCERTAINTY_INIT: True

    PRED_DIRECT_DEPTH: True

    PRED_GROUND_PLANE: False            # UAV: no ground under a flying drone (horizon heatmap + 1.65 m camera height removed)
    HORIZON_GAUSSIAN_RADIUS: 2
    WEIGHTINCREASED: True
    USE_EDGE_SLOPE: False
    HORIZON_FITTING_METHOD: 'LS'
    PRED_MULTI_Y3D: False
    TRAIN_Y3D_KPTS_FROM_GT: True

    # UAV: single-class statistics from sim_train (uav_tools/sim_stats.py), internal order (l, h, w)
    DIMENSION_MEAN: ((0.6462, 0.2509, 0.6196), )
    DIMENSION_STD: ((0.5403, 0.1923, 0.4902), )
    Y_MEAN: (-0.1334, )
    Y_STD: (0.8069, )

  REDUCE_LOSS_NORM: True
  USE_SYNC_BN: True

Y3D_REG: ['linear', True]               # UAV: official default ['exp', True] gives y3d = mean + std*exp(o) >= mean,
                                        #      i.e. cannot represent Y below the mean (drones are above AND below the camera)
Y3D_RANGE: [-3.08, 2.65]                # UAV: sim_train min/max of EL (KITTI: [-2.14, 4.09], also the data range)

UAV:
  ENABLE: True
  IMG_W: 960
  IMG_H: 540
  NUM_ANGLES: 3
  YAW_INDEX: 0
  STRICT_HEIGHT_DEPTH_FILTER: False

SOLVER:
  OPTIMIZER: 'adamw'
  BASE_LR: 3e-4
  WEIGHT_DECAY: 1e-5
  LR_WARMUP: False
  WARMUP_STEPS: 2000

  # for 1 GPU
  LR_DECAY: 0.1

  EVAL_AND_SAVE_EPOCH: True
  EVAL_EPOCH_INTERVAL: 1
  SAVE_CHECKPOINT_EPOCH_INTERVAL: 1
  MAX_EPOCHS: 19                        # UAV: iteration-matched to the official 100 ep x 3712 / 8 = 46,400 it (see NOTES)
  DECAY_EPOCH_STEPS: [15, 17]           # UAV: official [80, 90] of 100 -> same fractions of 19

  IMS_PER_BATCH: 8
  EVAL_INTERVAL: 1000

TEST:
  UNCERTAINTY_AS_CONFIDENCE: True
  DETECTIONS_THRESHOLD: 0.2
  METRIC: ['R40']

OUTPUT_DIR: "./output"
SEED: 107801
