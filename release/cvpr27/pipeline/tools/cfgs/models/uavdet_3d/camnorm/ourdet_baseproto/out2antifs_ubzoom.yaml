# [review1113 ourdet_baseproto, 11-17] UPPER BOUND (real supervised) WITH the sim recipe's view augmentation (VIEW_AUG).
# = out2antifs_ub.yaml (our outdoor recipe sim_out_r34_geo_ramp_out, ImageNet init, sealed train labels index_ub_gt.pkl, user-approved
# for this row only), but the train frames are read from the full-resolution JPEG store (lib/build_ub_jpeg.py, K_in = K_raw) through
