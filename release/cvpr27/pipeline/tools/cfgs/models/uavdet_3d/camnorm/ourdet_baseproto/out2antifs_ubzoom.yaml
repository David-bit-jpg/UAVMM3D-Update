# values + zoom_out_max 8 (window may be up to 8x the frame, mean-colour canvas; see ub_zoom_dataset.py for why).
_BASE_CONFIG_: cfgs/models/uavdet_3d/camnorm/sim_out_r34_geo_ramp_out.yaml
DATA_CONFIG:
    DATASET: 'UBZoom_Det_Dataset'
    DATA_PATH: 'F:/ourdet_baseproto_cache/outdoor_real_fs_jpeg'
    INDEX_FILE: 'index_ub_gt.pkl'
    NORM_MEAN: [0.4968, 0.5059, 0.5084]
    NORM_STD: [0.1854, 0.1816, 0.1970]
    MIN_RGB_VIS: 0.0
    VIEW_AUG: {zoom: [1.0, 4.0], no_upscale: false, t_range: [1.0, 4.6], max_upscale: 2.0, zoom_out_max: 8.0}
